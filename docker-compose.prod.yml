version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: feelweell_mongodb_prod
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - mongodb_data:/data/db
    networks:
      - feelweell_network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: feelweell_rabbitmq_prod
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - feelweell_network

  auth-service:
    build:
      context: .
      dockerfile: dockerfiles/prod/Dockerfile.auth-service.prod
    container_name: feelweell_auth_service_prod
    restart: always
    environment:
      - PORT=5000
      - URI_MONGODB=${MONGO_URI_AUTH}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ISSUER=${JWT_ISSUER}
      - JWT_AUDIENCE=${JWT_AUDIENCE}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN}
      - EMAIL_PROVIDER=${EMAIL_PROVIDER}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASS=${EMAIL_PASS}
      - FRONTEND_URL=${FRONTEND_URL}
      - SEEDER_ADMIN_EMAIL=${SEEDER_ADMIN_EMAIL}
      - SEEDER_ADMIN_PASSWORD=${SEEDER_ADMIN_PASSWORD}
      - NODE_TLS_REJECT_UNAUTHORIZED=1
      - NODE_ENV=production
    depends_on:
      - mongodb
      - rabbitmq
    networks:
      - feelweell_network

  ai-chat-service:
    build:
      context: .
      dockerfile: dockerfiles/prod/Dockerfile.ai-chat-service.prod
    container_name: feelweell_ai_chat_service_prod
    restart: always
    environment:
      - PORT=5001
      - URI_MONGODB=${MONGO_URI_AI}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ISSUER=${JWT_ISSUER}
      - JWT_AUDIENCE=${JWT_AUDIENCE}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - ALLOWED_ORIGINS=${FRONTEND_URL}
      - NODE_TLS_REJECT_UNAUTHORIZED=1
      - NODE_ENV=production
    depends_on:
      - mongodb
    networks:
      - feelweell_network

  mood-tracking:
    build:
      context: .
      dockerfile: dockerfiles/prod/Dockerfile.mood-tracking.prod
    container_name: feelweell_mood_tracking_prod
    restart: always
    environment:
      - PORT=5002
      - URI_MONGODB=${MONGO_URI_MOOD}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ISSUER=${JWT_ISSUER}
      - JWT_AUDIENCE=${JWT_AUDIENCE}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN}
      - RABBITMQ_URL=${RABBITMQ_URL}
      - RABBITMQ_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_PASS=${RABBITMQ_DEFAULT_PASS}
      - RABBITMQ_EXCHANGE=mood.events
      - RABBITMQ_DLX=mood.events.dlx
      - ALLOWED_ORIGINS=${FRONTEND_URL}
      - NODE_TLS_REJECT_UNAUTHORIZED=1
      - NODE_ENV=production
    depends_on:
      - mongodb
      - rabbitmq
    networks:
      - feelweell_network

  healthy-service:
    build:
      context: .
      dockerfile: dockerfiles/prod/Dockerfile.healthy-service.prod
    container_name: feelweell_healthy_service_prod
    restart: always
    environment:
      - PORT=5003
      - URI_MONGODB=${MONGO_URI_HEALTHY}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ISSUER=${JWT_ISSUER}
      - JWT_AUDIENCE=${JWT_AUDIENCE}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - CLOUDINARY_BASE_FOLDER=${CLOUDINARY_BASE_FOLDER}
      - CLOUDINARY_DEFAULT_AVATAR_NAME=${CLOUDINARY_DEFAULT_AVATAR_NAME}
      - ALLOWED_ORIGINS=${FRONTEND_URL}
      - NODE_TLS_REJECT_UNAUTHORIZED=1
      - NODE_ENV=production
    depends_on:
      - mongodb
    networks:
      - feelweell_network

  daily-positive-service:
    build:
      context: .
      dockerfile: dockerfiles/prod/Dockerfile.daily-positive-service.prod
    container_name: feelweell_daily_positive_service_prod
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - MongoDbSettings__ConnectionString=${MONGO_URI_DAILY}
      - MongoDbSettings__DatabaseName=FeelWeell_DailyPositive
      - JwtSettings__Secret=${JWT_SECRET}
      - JwtSettings__Issuer=${JWT_ISSUER}
      - JwtSettings__Audience=${JWT_AUDIENCE}
      - RabbitMQSettings__HostName=rabbitmq
      - RabbitMQSettings__UserName=${RABBITMQ_DEFAULT_USER}
      - RabbitMQSettings__Password=${RABBITMQ_DEFAULT_PASS}
    depends_on:
      - mongodb
      - rabbitmq
    networks:
      - feelweell_network

  client-admin:
    build:
      context: .
      dockerfile: dockerfiles/prod/Dockerfile.client-admin.prod
      args:
        - NEXT_PUBLIC_API_GATEWAY_URL=${NEXT_PUBLIC_API_GATEWAY_URL}
    container_name: feelweell_client_admin_prod
    restart: always
    environment:
      - NODE_ENV=production
    networks:
      - feelweell_network

  nginx-gateway:
    build:
      context: .
      dockerfile: dockerfiles/prod/Dockerfile.nginx.prod
    container_name: feelweell_nginx_gateway_prod
    restart: always
    ports:
      - "80:80"
    depends_on:
      - auth-service
      - ai-chat-service
      - mood-tracking
      - healthy-service
      - daily-positive-service
      - client-admin
    networks:
      - feelweell_network

volumes:
  mongodb_data:
  rabbitmq_data:

networks:
  feelweell_network:
    driver: bridge
